<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport strictly optimized for mobile to prevent zooming and scaling issues -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Happy Birthday Pyari Bauni ❤️</title>
    
    <!-- Preconnect for performance on Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Premium Typography: Cinzel (Luxury Headings), Great Vibes (Handwritten Script), Montserrat (Clean Body Text) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Background Audio - CrossOrigin is critical to prevent Web Audio API CORS blocks on GitHub pages -->
    <audio id="bg-music" src="music/birthday.mp3" preload="auto" loop crossorigin="anonymous"></audio>

    <!-- Canvas for Heavy Physics Effects (Stars, Fireflies, Fireworks) -->
    <canvas id="effects-canvas" aria-hidden="true"></canvas>
    
    <!-- CSS Container for Hardware-Accelerated Effects (Hearts, Petals) to prevent Canvas mobile lag -->
    <div id="css-particles" aria-hidden="true"></div>

    <!-- Desktop Mouse Glow (Disabled on touch devices via CSS/JS) -->
    <div id="mouse-glow" aria-hidden="true"></div>

    <!-- 1. PRELOADER -->
    <div id="preloader" class="active">
        <div class="preloader-content">
            <div class="moon-loader">
                <div class="moon-crater crater-1"></div>
                <div class="moon-crater crater-2"></div>
                <div class="moon-crater crater-3"></div>
            </div>
            <p class="loading-text">A moment in time...</p>
        </div>
    </div>

    <!-- MAIN APP WRAPPER (Hidden initially to prevent layout shifts) -->
    <main id="app-container" class="hidden">
        
        <!-- 2. OPENING SCREEN -->
        <section id="opening-screen" class="screen full-height active">
            <div class="glass-card">
                <div class="large-moon-bg"></div>
                <div class="stars-overlay"></div>
                <button id="open-surprise-btn" class="glow-button" aria-label="Open your birthday surprise">
                    <span class="btn-text">✨ Open Your Surprise ✨</span>
                    <div class="btn-glow"></div>
                </button>
            </div>
        </section>

        <!-- 3. HERO SECTION -->
        <section id="hero-screen" class="screen full-height">
            <div class="hero-content">
                <h1 class="cinematic-title">
                    <span class="line-one">Happy Birthday</span>
                    <span class="line-two gradient-text">Pyari Bauni ❤️</span>
                </h1>
            </div>
            <!-- Scroll Indicator with Apple-like minimal design -->
            <div class="scroll-indicator" aria-hidden="true">
                <span>Scroll</span>
                <div class="arrow-down"></div>
            </div>
        </section>

        <!-- 4. LETTER SECTION -->
        <section id="letter-screen" class="screen full-height">
            <div class="glass-letter-container">
                <div class="paper-texture">
                    <div class="typewriter-content" id="typewriter-text" aria-live="polite"></div>
                    <span class="cursor" id="typewriter-cursor">|</span>
                </div>
            </div>
        </section>

        <!-- 5. GALLERY SECTION -->
        <section id="gallery-screen" class="screen">
            <h2 class="section-title">Precious Memories</h2>
            <div class="gallery-grid">
                <!-- Gallery items include a skeleton loader to prevent UI breakage if images load slowly -->
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/1.jpg" alt="Memory 1" loading="lazy">
                </div>
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/2.jpg" alt="Memory 2" loading="lazy">
                </div>
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/3.jpg" alt="Memory 3" loading="lazy">
                </div>
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/4.jpg" alt="Memory 4" loading="lazy">
                </div>
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/5.jpg" alt="Memory 5" loading="lazy">
                </div>
                <div class="gallery-item glass-card-image">
                    <div class="image-skeleton"></div>
                    <img src="photos/6.jpg" alt="Memory 6" loading="lazy">
                </div>
            </div>
        </section>

        <!-- 8. FINAL SCENE (Fireworks will render on the canvas behind this) -->
        <section id="final-screen" class="screen full-height">
            <div class="final-content">
                <div class="huge-glowing-moon"></div>
                <h1 class="final-title">Happy Birthday Pyari Bauni ❤️</h1>
                <p class="final-subtitle">Thank You For Being Such A Beautiful Part<br>Of My Life ❤️</p>
            </div>
        </section>

    </main>

    <!-- FULLSCREEN IMAGE MODAL -->
    <div id="image-modal" class="modal hidden" aria-modal="true" role="dialog">
        <button class="close-modal" aria-label="Close fullscreen image">&times;</button>
        <div class="modal-content-wrapper">
            <div class="modal-loader hidden"></div>
            <img id="modal-image" src="" alt="Fullscreen Memory">
        </div>
    </div>

    <!-- Main Logic -->
    <script src="script.js"></script>
</body>
</html>
